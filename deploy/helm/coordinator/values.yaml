# Blue/Green deployment support
# When enabled, renders both blue and green Deployments and PVCs from a single release
# The Service selector uses activeSlot to route traffic to the active deployment
blueGreen:
  enabled: false
  activeSlot: blue    # Which slot the Service routes traffic to

# Coordinator Helm Chart Values
replicaCount: 1
# Covers bounded HTTP, producer, and database drain before Kubernetes sends SIGKILL.
terminationGracePeriodSeconds: 120

image:
  repository: coordinator
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8080
  # Operator port on the separate <release>-admin ClusterIP Service.
  # Reach it through an operator tunnel or port-forward, never through the ingress.
  adminPort: 9991

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi

persistence:
  enabled: true
  size: 1Gi
  mountPath: /data

litestream:
  enabled: false
  image:
    repository: litestream/litestream
    tag: "0.5.6"
  s3Bucket: ""
  s3Region: "us-west-2"
  s3Endpoint: ""
  s3ForcePathStyle: false
  syncInterval: "10s"
  retention: "168h"
  snapshotInterval: "1h"
  retentionCheckInterval: "1h"
  # Encryption key for Litestream backups (age key format)
  # Can be set directly or via encryptionKeySecret to reference a K8s secret
  encryptionKey: ""
  encryptionKeySecret:
    enabled: false
    name: ""
    key: "encryption-key"
  # Use IAM role for S3 access (recommended for EC2/EKS)
  useIAMRole: false
  databases:
    - name: competitions
      path: /data/competitions.db
      s3Path: competitions.db
    - name: users
      path: /data/users.db
      s3Path: users.db

keymeld:
  url: "http://keymeld.keymeld.svc.cluster.local:8080"
  enabled: true
  gatewayUrl: "http://keymeld.keymeld.svc.cluster.local:8080"
  # Browser-reachable gateway with the coordinator origin allowed by Keymeld CORS.
  publicGatewayUrl: ""
  # Pin PCR0 or PCR8 from the reviewed enclave build. Required when enabled.
  trustedPcrs: {}
  # Trust simulated enclaves without Nitro attestation (Moto-backed staging only).
  # Refused on mainnet and together with trustedPcrs.
  dangerousTrustUnattestedEnclaves: false
  keygenSessionExpirySecs: 86400  # 24 hours (max allowed by keymeld)
  signingSessionExpirySecs: 86400  # 24 hours (max allowed by keymeld)
  maxPollingAttempts: 100
  initialPollingDelayMs: 100
  maxPollingDelayMs: 5000
  pollingBackoffMultiplier: 1.5

lnd:
  host: "lnd1"
  rpcPort: 10009
  macaroonPath: /lnd/admin.macaroon
  tlsCertPath: /lnd/tls.cert
  initContainer:
    enabled: false
    image: busybox:1.36
    sourcePvc: lnd1-data

bitcoin:
  rpcHost: "bitcoind"
  rpcPort: 18443
  rpcUser: "bitcoin"
  rpcPassword: "bitcoinpass"
  network: regtest
  electrumUrl: "tcp://electrs.bitcoin.svc.cluster.local:60401"
  explorerUrl: "http://esplora.bitcoin.svc.cluster.local:3000"
  refreshBlocksSecs: 10

lightning:
  baseUrl: "https://lnd1.bitcoin.svc.cluster.local:8080"
  tlsCertPath: "/etc/coordinator/secrets/tls.cert"
  invoiceWatchIntervalSecs: 5
  payoutWatchIntervalSecs: 10

oracle:
  url: "http://noaa-oracle.oracle.svc.cluster.local:8080"

config:
  logLevel: info
  dbPath: /data/coordinator.db
  database:
    dataFolder: /data
    readMaxConnections: 5
    readMinConnections: 1
    writeMaxConnections: 1
    writeMinConnections: 1
    idleTimeoutSecs: 300
    acquireTimeoutSecs: 30
    sqlite:
      mode: rwc
      cache: Private
      busyTimeoutMs: 5000
      journalMode: WAL
      synchronous: NORMAL
      cacheSize: -2000
      foreignKeys: true
      walAutocheckpoint: 1000
      tempStore: MEMORY
      mmapSize: 268435456
      pageSize: 4096
  api:
    domain: "0.0.0.0"
    port: "8080"
    origins:
      - "*"
  ui:
    # Origin the operator's browser uses to reach the operator listener (tunnel name).
    privateUrl: "http://localhost:9991"
    remoteUrl: "http://localhost:8080"
    uiDir: "/app/ui"
  coordinator:
    name: "local-coordinator"
    relativeLockTimeBlockDelta: 144
    requiredConfirmations: 1
    syncIntervalSecs: 60
    escrowEnabled: false
    invoiceSettlementConfirmations: 0

secrets:
  # Support for external secrets (managed outside Helm)
  privateKey:
    create: false
    value: ""
  # Operator bearer token for the admin listener (at least 32 characters, e.g.
  # `openssl rand -hex 32`). The coordinator refuses to start without it.
  adminToken:
    create: false
    value: ""
    external: false
    secretName: "coordinator-admin-token"
  lnd:
    create: false
    external: false
    secretName: "lnd-credentials"
    macaroon: ""
    tlsCert: ""

devMode:
  enabled: false
  hostPath: /mnt/coordinator/coordinator
  baseImage: debian:bookworm-slim
