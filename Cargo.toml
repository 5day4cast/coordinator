[workspace]
members = [
    "crates/coordinator",
    "crates/coordinator-core",
    "crates/coordinator-wasm",
    "crates/synth",
    "crates/coordinator-escrow",
    "crates/coordinator-escrow-verifier",
    "crates/coordinator-verifier-enclave",
    "crates/coordinator-lnurl-relay",
    "crates/coordinator-payout-witness",
    "crates/coordinator-ark-escrow",
    "crates/coordinator-ark",
    "crates/coordinator-ark-swap",
    "crates/coordinator-recover",
]
# Nitro enclave and VSock relay binaries build only when selected explicitly.
default-members = [
    "crates/coordinator", "crates/coordinator-core", "crates/coordinator-wasm",
    "crates/synth", "crates/coordinator-escrow", "crates/coordinator-ark-escrow",
    "crates/coordinator-ark", "crates/coordinator-ark-swap", "crates/coordinator-recover",
]
resolver = "2"

[workspace.package]
version = "2.27.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/5day4cast/coordinator"

[workspace.metadata.crane]
name = "coordinator"

[workspace.dependencies]
# Internal crates
coordinator-core = { path = "crates/coordinator-core" }
coordinator-escrow = { path = "crates/coordinator-escrow" }
coordinator-ark-escrow = { path = "crates/coordinator-ark-escrow" }
coordinator-ark = { path = "crates/coordinator-ark" }
coordinator-recover = { path = "crates/coordinator-recover", default-features = false }

# Arkade: arkd's Rust SDK. The generated gRPC code is checked in, so no protoc is needed.
ark-core = "0.11"
ark-grpc = { version = "0.11", default-features = false, features = ["tls-webpki-roots"] }
# The same gRPC stack ark-grpc uses, for the one arkd call it does not expose (DeleteIntent).
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-webpki-roots"] }
tonic-prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Keymeld: released SDK and services on the published dlctix crate.
# keymeld-sdk and the coordinator must resolve dlctix from the same source.
# Keymeld 0.10.1 includes bounded command history and concurrent signing rounds.
# Every crate that names Keymeld pins the same rev.
keymeld-sdk = { git = "https://github.com/tee8z/keymeld", rev = "f082e28b384a9236c69162838b8a68f832c75f82", default-features = false, features = ["escrow", "dlctix"] }
keymeld-core = { git = "https://github.com/tee8z/keymeld", rev = "f082e28b384a9236c69162838b8a68f832c75f82", default-features = false, features = ["escrow"] }

# Bitcoin
bitcoin = { version = "0.32", features = ["serde", "base64", "rand-std"] }
electrum-client = "0.21"
dlctix = "0.2.2"
miniscript = "12.3.2"

# Web
axum = { version = "0.8.1", features = ["http1", "macros", "multipart", "tokio", "tracing", "original-uri"] }
axum-extra = { version = "0.10", features = ["form"] }
tower-http = { version = "0.5.2", features = ["cors", "fs"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
maud = { version = "0.26", features = ["axum"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
reqwest-middleware = { version = "0.3.3", features = ["json", "rustls-tls"] }
reqwest-retry = "0.6.1"
hyper = "1.4.0"
h2 = "0.4.16"

# Async
tokio = { version = "1.39.2", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.11", features = ["rt"] }
futures = "0.3.28"
dashmap = "6.1"
async-trait = "0.1.85"
async-channel = "2.3.1"

# Serialization
serde = { version = "1.0.188", features = ["derive"] }
# Oracle signatures and queued-entry consent commit to the exact f64 bits of lines.
# Preserve those bits across HTTP, persisted JSON, browser WASM, and enclave payloads.
serde_json = { version = "1.0.117", features = ["float_roundtrip"] }
toml = "0.8.10"

# Database
sqlx = { version = "0.8.6", features = ["sqlite", "uuid", "time", "json", "bigdecimal", "macros", "runtime-tokio", "migrate"] }

# Nostr
nostr = { version = "0.44.8", features = ["nip04", "nip44", "nip47", "nip49", "nip98"] }

# Logging
log = "0.4.18"
fern = { version = "0.6.2", features = ["colored"] }

# Error handling
anyhow = "1.0.103"
thiserror = "1.0.62"

# Crypto
blake2 = "0.10.6"
sha2 = "0.10"
# Already in the lock through Keymeld; no default features, so no OS RNG through aead.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
rand = "0.9"
rand_chacha = "0.9"

# Time
time = { version = "0.3.47", features = ["formatting", "macros", "parsing", "serde"] }

# Utilities
uuid = { version = "1.4.1", features = ["serde", "v7"] }
hex = "0.4.3"
base64 = "0.22.1"
itertools = "0.14.0"
secrecy = { version = "0.10.3", features = ["serde"] }
zeroize = { version = "1.6", features = ["zeroize_derive"] }

# CLI
clap = { version = "4.3.23", features = ["derive", "env"] }
config = "0.14.0"

# Lightning
lightning-invoice = { version = "0.33.2", features = ["std"] }

# Metrics
prometheus = { version = "0.13.4", default-features = false }
lazy_static = "1.4"

# Misc
num_cpus = "1.16.0"
mime = "0.3.17"
openssl = "0.10.81"
pem-rfc7468 = { version = "0.7.0", features = ["alloc"] }

# WASM (for coordinator-wasm)
wasm-bindgen = { version = "0.2.100", features = ["serde-serialize", "std"] }
wasm-bindgen-futures = "0.4.43"
wasm-logger = "0.2.0"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["Document", "Element", "HtmlElement", "Node", "Window", "CustomEventInit", "console"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
# Native signing must finish inside Arkade's batch window. Browser size settings
# are kept in the separate wasm-release profile below.
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

# The browser module (coordinator-wasm): smallest code overall, but the
# key-derivation crates at full speed, since log-in runs scrypt (N=2^17)
# on the page. panic=abort drops the unwinding tables wasm never uses.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release.package.scrypt]
opt-level = 3

[profile.wasm-release.package.salsa20]
opt-level = 3

[profile.wasm-release.package.pbkdf2]
opt-level = 3

[profile.wasm-release.package.hmac]
opt-level = 3

[profile.wasm-release.package.sha2]
opt-level = 3

# ark-client 0.11.0 misses its own batch failing when it only spends boarding UTXOs, then signs
# the next batch's commitment TX, signs nothing and gets INVALID_BOARDING_INPUT_SIG ("no signed
# inputs found"). The fork branch listens on the boarding outpoints, ignores other batches' events
# and refuses to submit an unsigned commitment TX. Remove this once upstream releases the fix.
# Every ark crate comes from the fork, so ark-client and our own ark-core/ark-grpc share one ark-core.
[patch.crates-io]
ark-client = { git = "https://github.com/tee8z/rust-sdk", branch = "fix/batch-events-by-id" }
ark-core = { git = "https://github.com/tee8z/rust-sdk", branch = "fix/batch-events-by-id" }
ark-delegator = { git = "https://github.com/tee8z/rust-sdk", branch = "fix/batch-events-by-id" }
ark-fees = { git = "https://github.com/tee8z/rust-sdk", branch = "fix/batch-events-by-id" }
ark-grpc = { git = "https://github.com/tee8z/rust-sdk", branch = "fix/batch-events-by-id" }
