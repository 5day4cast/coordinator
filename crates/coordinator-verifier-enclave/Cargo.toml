keymeld-core = { git = "https://github.com/tee8z/keymeld", rev = "323110d805301bc8182515c6b3605957d7b0c6f0", default-features = false, features = ["escrow", "enclave"] }
keymeld-enclave = { git = "https://github.com/tee8z/keymeld", rev = "323110d805301bc8182515c6b3605957d7b0c6f0", default-features = false, features = ["escrow"] }
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
