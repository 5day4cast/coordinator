[package]
name = "coordinator-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types for coordinator server and WASM client"

[features]
default = []
keymeld = ["dep:keymeld-sdk", "dep:coordinator-escrow", "dep:hex"]

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true

# Time
time.workspace = true

# Utilities
thiserror.workspace = true
uuid.workspace = true
keymeld-sdk = { workspace = true, features = ["client", "escrow"], optional = true }
coordinator-escrow = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
axum.workspace = true
