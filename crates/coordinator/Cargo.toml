[package]
name = "coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable mock Bitcoin/Lightning clients for E2E testing
# This feature is automatically enabled for debug builds
e2e-testing = []

[package.metadata.cargo-machete]
ignored = ["blake2", "coordinator-core", "h2", "hex", "lightningcss", "openssl", "oxc"]

[dependencies]
coordinator-ark.workspace = true
coordinator-ark-escrow.workspace = true
coordinator-escrow.workspace = true
coordinator-core = { workspace = true, features = ["keymeld"] }

# Web
axum.workspace = true
axum-extra.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
maud.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-retry.workspace = true
hyper.workspace = true
h2.workspace = true

# Bitcoin: the wallet lives in LND; electrs answers chain lookups
bitcoin.workspace = true
miniscript.workspace = true
electrum-client.workspace = true
dlctix.workspace = true

# Keymeld
keymeld-sdk = { workspace = true, features = ["client", "dlctix"] }
keymeld-core.workspace = true

# Async
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
dashmap.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Database
sqlx.workspace = true

# Nostr
nostr.workspace = true

# Logging
log.workspace = true
fern.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Crypto
blake2.workspace = true
rand.workspace = true
rand_chacha.workspace = true
argon2 = "0.5"

# Time
time.workspace = true

# Utilities
uuid.workspace = true
hex.workspace = true
base64.workspace = true
itertools.workspace = true
secrecy.workspace = true
zeroize.workspace = true

# CLI
clap.workspace = true
config.workspace = true

# Lightning
lightning-invoice.workspace = true

# Misc
# Gzips the WASM package once instead of on every download.
flate2 = "1.1"
sha2 = "0.10"
mime.workspace = true
openssl.workspace = true
pem-rfc7468.workspace = true

[dev-dependencies]
coordinator-ark = { workspace = true, features = ["test-utils"] }
# The LNURL provider fixtures let enclave tests exercise a refund end to end.
coordinator-escrow-verifier = { path = "../coordinator-escrow-verifier", features = ["test-support"] }
keymeld-enclave = { git = "https://github.com/tee8z/keymeld", rev = "98f3420dee497508d2c1ff19180ea795dab5a40e", default-features = false, features = ["escrow", "test-support"] }
tempfile = "3"
# Drives routers directly in route-isolation tests.
tower = { version = "0.5", features = ["util"] }
# Synthetic gateways must strip the SDK's gzip request bodies like the real gateway.
tower-http = { workspace = true, features = ["decompression-gzip"] }
maplit = "1.0.2"
mockall = "0.11"
tokio-test = "0.4"
env_logger = "0.11.6"

[build-dependencies]
oxc = { version = "0.146", default-features = false, features = ["codegen", "minifier"] }
flate2 = "1.1"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "coordinator"
path = "src/main.rs"

[[bin]]
name = "wallet-cli"
path = "src/bin/wallet_cli.rs"
