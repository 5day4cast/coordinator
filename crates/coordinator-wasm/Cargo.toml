[package]
name = "coordinator-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM client for the coordinator: Nostr auth and the DLC entry wallet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM
wasm-bindgen.workspace = true
wasm-logger.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

# Nostr - use WASM-compatible features only
nostr-sdk = { version = "0.38", default-features = false, features = ["nip07", "nip04", "nip44"] }

# Bitcoin (`base64` for PSBT encoding)
bitcoin.workspace = true
dlctix.workspace = true

# Keymeld registration: attestation-verified, context-bound entry key envelopes
coordinator-core = { path = "../coordinator-core", features = ["keymeld"] }

# Crypto
sha2.workspace = true
rand.workspace = true
rand_chacha.workspace = true
zeroize.workspace = true
scrypt = "0.11"
chacha20poly1305 = "0.10"
base64 = "0.22"

# Serialization
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

# Utilities
thiserror.workspace = true
async-trait.workspace = true
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom 0.2 with js feature for older dependencies
getrandom.workspace = true
# getrandom 0.3 with wasm_js feature for rand 0.9+
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
