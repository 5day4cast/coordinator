[package]
name = "coordinator-synth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Synthetic testing tool and CLI for coordinator"

[[bin]]
name = "synth"
path = "src/bin/synth.rs"

[[bin]]
name = "coord"
path = "src/bin/coord.rs"

[dependencies]
coordinator-core = { workspace = true, features = ["keymeld"] }
# Reads an entry's Arkade escrow terms from the payout policy it signs.
coordinator-ark-escrow.workspace = true

# Keymeld SDK for auth pubkey derivation and enclave encryption
keymeld-sdk.workspace = true

# Web
axum.workspace = true
tower-http.workspace = true
maud.workspace = true
reqwest.workspace = true

# Async
tokio.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Database
sqlx.workspace = true

# Nostr
nostr.workspace = true

# Logging
log.workspace = true
fern.workspace = true

# Error handling
anyhow.workspace = true
zeroize.workspace = true
thiserror.workspace = true

# Crypto
sha2.workspace = true
blake2.workspace = true
rand.workspace = true
rand_chacha.workspace = true

# Bitcoin (for key derivation)
dlctix.workspace = true
lightning-invoice.workspace = true

# Time
time.workspace = true

# Utilities
uuid.workspace = true
hex.workspace = true
base64.workspace = true
secrecy.workspace = true
clap.workspace = true
config.workspace = true

# Metrics
prometheus.workspace = true
lazy_static.workspace = true

[dev-dependencies]
tempfile = "3"
# Drives the asset router directly.
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
# Minify the dashboard's styles and scripts into content-hashed bundles.
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
# One pinned oxc across the workspace's and the oracle's build scripts; its 0.x API changes often.
oxc = { version = "=0.151.0", default-features = false, features = ["codegen", "minifier"] }
sha2.workspace = true
