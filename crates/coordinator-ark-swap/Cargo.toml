[package]
name = "coordinator-ark-swap"
description = "ark-swapd: swaps Lightning payments into Arkade escrow VTXOs from its own Ark wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ark-swapd"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
anyhow = { workspace = true }
ark-client = { version = "0.11", default-features = false, features = ["tls-webpki-roots"] }
ark-core = { workspace = true }
ark-grpc = { workspace = true }
coordinator-ark-escrow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bitcoin = { workspace = true }
clap = { workspace = true }
coordinator-ark = { workspace = true }
electrum-client.workspace = true
fern = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
rand08 = { package = "rand", version = "0.8" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rustls.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tonic-prost = { workspace = true }
