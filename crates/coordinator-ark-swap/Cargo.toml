[package]
name = "coordinator-ark-swap"
description = "ark-swapd: swaps Lightning payments into Arkade escrow VTXOs from its own Ark wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ark-swapd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
ark-client = { version = "0.11", default-features = false, features = ["tls-webpki-roots"] }
ark-bdk-wallet = "0.11"
ark-core = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bitcoin = { workspace = true }
clap = { workspace = true }
coordinator-ark = { workspace = true }
esplora-client = { version = "0.11", default-features = false, features = ["async-https", "tokio"] }
fern = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
rand08 = { package = "rand", version = "0.8" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
uuid = { workspace = true }
