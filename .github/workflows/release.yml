name: Release

on:
  push:
    tags:
      - "v*.*.*"
    # A push to master builds the release jobs to warm their caches (see
    # prepare-release), so a tagged release, including a hotfix, compiles only
    # the workspace's own crates.
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Committed release version without v (e.g., 2.0.0)"
        required: true
        type: string
      dry_run:
        description: "Build review artifacts without publishing a release or container images"
        required: false
        type: boolean
        default: true
      build_images:
        description: "Build the container images; a dry run that needs only the packages can skip them"
        required: false
        type: boolean
        default: true

# Serialize publication, including updates to the latest container manifests.
concurrency:
  group: ${{ github.ref_type == 'tag' && 'release' || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_OFFLINE: "true"

jobs:
  prepare-release:
    name: Validate Release Source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      version_name: ${{ steps.release.outputs.version_name }}
      source: ${{ steps.release.outputs.source }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      build_images: ${{ steps.release.outputs.build_images }}
      warm: ${{ steps.release.outputs.warm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release helper regressions
        run: python3 -m unittest discover -s scripts -p 'test_release.py' -v
      - name: Check native OpenSSL build helper regressions
        run: python3 -m unittest discover -s scripts -p 'test_build_release_openssl.py' -v
      - name: Validate committed versions and release tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_BUILD_IMAGES: ${{ inputs.build_images }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            # Cache warming on master: build like a release, publish nothing.
            VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
            {
              echo "version=$VERSION"
              echo "version_name=v$VERSION"
              echo "source=$GITHUB_SHA"
              echo "dry_run=true"
              echo "build_images=false"
              echo "warm=true"
            } >> "$GITHUB_OUTPUT"
            echo "Warming release caches at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            DRY_RUN="$INPUT_DRY_RUN"
            BUILD_IMAGES="$INPUT_BUILD_IMAGES"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            DRY_RUN=false
            BUILD_IMAGES=true
          fi
          if [ "$DRY_RUN" != true ] && [ "$BUILD_IMAGES" != true ]; then
            echo "A published release needs its container images; only a dry run may skip them." >&2
            exit 1
          fi
          SOURCE=$(python3 scripts/release.py validate --version "$VERSION" \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --dry-run "$DRY_RUN")
          {
            echo "version=$VERSION"
            echo "version_name=v$VERSION"
            echo "source=$SOURCE"
            echo "dry_run=$DRY_RUN"
            echo "build_images=$BUILD_IMAGES"
            echo "warm=false"
          } >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION from $SOURCE (dry_run=$DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"

  build-wasm:
    name: Build Browser WASM
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Compiled dependencies come from the cache that pushes to master write;
      # only those runs save it, so a pull request can't change what a
      # release links. The workspace's own crates always compile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-wasm
          save-if: ${{ needs.prepare-release.outputs.warm == 'true' }}
      - name: Install matching WASM bindings generator
        run: |
          BINDGEN_VERSION=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          # The project's own release build, instead of compiling it here.
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$BINDGEN_VERSION/wasm-bindgen-$BINDGEN_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-$BINDGEN_VERSION-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Install wasm-opt and brotli
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_125/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y --no-install-recommends brotli
      - name: Build locked browser module
        run: |
          scripts/build-wasm.sh wasm-pkg
          # Brotli and gzip copies, which the server sends to browsers that
          # accept them instead of the full module.
          for f in wasm-pkg/*.js wasm-pkg/*.wasm; do
            brotli -q 11 -k "$f"
            gzip -9 -k -n "$f"
          done
          ls -l wasm-pkg
        env:
          CC_wasm32_unknown_unknown: clang
          CFLAGS_wasm32_unknown_unknown: "-Wno-error=implicit-function-declaration"
      - name: Package WASM and source manifest
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE: ${{ needs.prepare-release.outputs.source }}
        run: python3 scripts/release.py wasm --version "$VERSION" --source "$SOURCE" --wasm wasm-pkg
      - uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # Compiles in parallel with build-wasm; package-native adds the WASM.
  build-release:
    name: Build Native Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: coordinator-x86_64-linux
          # Also the arm64 container images' binaries.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: coordinator-aarch64-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: coordinator-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: coordinator-aarch64-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deleting these took ~2 minutes in the foreground; the build doesn't
      # need the space until well after it has started.
      - name: Free disk space (Linux, in the background)
        if: runner.os == 'Linux'
        run: |
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; docker image prune --all --force; apt-get clean' \
            >/dev/null 2>&1 &
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # See build-wasm: dependencies from master's cache; only master saves it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ needs.prepare-release.outputs.warm == 'true' }}
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl curl
      # The helper reuses a cached build only when its stamp matches the
      # verified release and target; the key changes with the helper itself.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/coordinator-openssl-${{ matrix.target }}
          key: openssl-${{ matrix.target }}-${{ hashFiles('scripts/build-release-openssl.sh') }}
      - name: Build verified static OpenSSL for the native target
        env:
          TARGET: ${{ matrix.target }}
          OPENSSL_REUSE_PREFIX: "1"
        run: |
          OPENSSL_BUILD_JOBS=$(getconf _NPROCESSORS_ONLN) \
            bash scripts/build-release-openssl.sh "$TARGET" "$RUNNER_TEMP/coordinator-openssl-$TARGET"
      - name: Build locked native binaries and UI
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p coordinator
      - name: Build the verifier enclave, LNURL relay, ark-swapd, and synth (Linux)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked --target "$TARGET" \
            -p coordinator-verifier-enclave --features coordinator-verifier-enclave/lnurl \
            -p coordinator-lnurl-relay -p coordinator-payout-witness -p coordinator-ark-swap -p coordinator-synth
      - name: Stage the coordinator binaries for packaging
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p native-bin
          cp "target/$TARGET/release/coordinator" "target/$TARGET/release/wallet-cli" native-bin/
      - uses: actions/upload-artifact@v4
        with:
          name: native-bin-${{ matrix.target }}
          path: native-bin/*
          if-no-files-found: error
          retention-days: 14
      - name: Package the verifier enclave for Keymeld hosts (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE: ${{ needs.prepare-release.outputs.source }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release.py enclave --version "$VERSION" --source "$SOURCE" --target "$TARGET"
      - name: Build and package the explicit simulation verifier (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE: ${{ needs.prepare-release.outputs.source }}
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked --target "$TARGET" -p coordinator-verifier-enclave \
            --features coordinator-verifier-enclave/lnurl,coordinator-verifier-enclave/payout-witness-local
          python3 scripts/release.py enclave-simulation --version "$VERSION" --source "$SOURCE" --target "$TARGET"
      - name: Package ark-swapd for the Arkade swap host (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE: ${{ needs.prepare-release.outputs.source }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release.py swap --version "$VERSION" --source "$SOURCE" --target "$TARGET"
      - name: Package synth for the synthetic-traffic host (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE: ${{ needs.prepare-release.outputs.source }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release.py synth --version "$VERSION" --source "$SOURCE" --target "$TARGET"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: release-hosts-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      # The container images copy these binaries instead of compiling again.
      - name: Stage binaries for the container images (Linux)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p image-bin
          cp "target/$TARGET/release/coordinator" "target/$TARGET/release/wallet-cli" \
            "target/$TARGET/release/synth" image-bin/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: image-bin-${{ matrix.target }}
          path: image-bin/*
          if-no-files-found: error
          retention-days: 14

  # The coordinator package: build-release's binaries plus the WASM package.
  # Only copying and archiving, so every target packages on one small runner.
  package-native:
    name: Package Native (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [prepare-release, build-wasm, build-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: coordinator-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            asset: coordinator-aarch64-linux
          - target: x86_64-apple-darwin
            asset: coordinator-x86_64-macos
          - target: aarch64-apple-darwin
            asset: coordinator-aarch64-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: native-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
      - uses: actions/download-artifact@v4
        with:
          name: release-wasm
          path: wasm-release
      - name: Assemble complete package and verify required UI assets
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE: ${{ needs.prepare-release.outputs.source }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          # Artifacts don't keep file modes.
          chmod 755 "target/$TARGET/release/coordinator" "target/$TARGET/release/wallet-cli"
          python3 scripts/release.py native --version "$VERSION" --source "$SOURCE" \
            --target "$TARGET" --asset "$ASSET" --wasm "wasm-release/coordinator-wasm-$VERSION.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  package-charts:
    name: Package Helm Charts
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.2
      - name: Lint and package charts
        run: |
          mkdir -p release
          helm lint deploy/helm/coordinator
          helm lint deploy/helm/synth
          helm package deploy/helm/coordinator --destination release
          helm package deploy/helm/synth --destination release
          python3 scripts/release.py checksums --output release
      - uses: actions/upload-artifact@v4
        with:
          name: release-charts
          path: release/*
          if-no-files-found: error
          retention-days: 14

  build-docker:
    # Assembled from the native job's binaries and the WASM package: nothing
    # compiles here. The Dockerfiles have no RUN step, so both architectures
    # build on one amd64 runner without emulation.
    name: Build Docker Images (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release, build-wasm]
    if: needs.prepare-release.outputs.build_images == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: image-bin-${{ matrix.target }}
          path: image/bin/${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: release-wasm
          path: wasm-release
      - name: Assemble the image context
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          chmod 755 image/bin/*/*
          mkdir -p image/ui/pkg
          tar -xzf "wasm-release/coordinator-wasm-$VERSION.tar.gz" -C image/ui/pkg --strip-components=1
          test -s image/ui/pkg/coordinator_wasm_bg.wasm
          test -s image/ui/pkg/coordinator_wasm.js
          ls -lR image
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          ORG_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx build --platform "linux/$ARCH" --load \
            -f deploy/docker/coordinator.Dockerfile -t "ghcr.io/$REPO_LOWER:$VERSION-$ARCH" image
          docker buildx build --platform "linux/$ARCH" --load \
            -f deploy/docker/synth.Dockerfile -t "ghcr.io/$ORG_LOWER/synth:$VERSION-$ARCH" image
      - name: Save review images
        if: needs.prepare-release.outputs.dry_run == 'true'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release
          docker save "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION-$ARCH" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synth:$VERSION-$ARCH" | gzip -n > "release/docker-$VERSION-$ARCH.tar.gz"
          python3 scripts/release.py checksums --output release
      - uses: actions/upload-artifact@v4
        if: needs.prepare-release.outputs.dry_run == 'true'
        with:
          name: review-docker-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Log in to GHCR
        if: needs.prepare-release.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push versioned architecture images
        if: needs.prepare-release.outputs.dry_run != 'true'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION-$ARCH"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synth:$VERSION-$ARCH"

  publish-images:
    name: Publish Container Manifests
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release, build-wasm, package-charts, build-docker]
    if: needs.prepare-release.outputs.dry_run != 'true'
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and latest from the same architecture images
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          for IMAGE in "ghcr.io/${GITHUB_REPOSITORY,,}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synth"; do
            for TAG in "$VERSION" latest; do
              docker manifest create "$IMAGE:$TAG" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
              docker manifest push "$IMAGE:$TAG"
            done
          done

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # The tarballs don't wait for the container images, which publish on their own.
    needs: [prepare-release, build-release, build-wasm, package-native, package-charts]
    if: needs.prepare-release.outputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Create release at the verified source commit
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.prepare-release.outputs.version_name }}
          tag_name: ${{ needs.prepare-release.outputs.version_name }}
          target_commitish: ${{ needs.prepare-release.outputs.source }}
          draft: false
          prerelease: false
          body_path: docs/releases/${{ needs.prepare-release.outputs.version_name }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tgz
            artifacts/**/*.sha256
            artifacts/**/SHA256SUMS
