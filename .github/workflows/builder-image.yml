name: Builder Image

# The release builds its Linux packages and browser WASM inside this image, which holds the
# toolchain, static OpenSSL, and every dependency precompiled. The tag is a hash of the inputs
# that decide those contents, so an unchanged lockfile reuses the image already published.
on:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - .cargo/config.toml
      - .github/builder/**
      - .github/workflows/builder-image.yml
      - scripts/build-release-openssl.sh
      - scripts/release-cargo.sh
      - scripts/builder_image.py
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build the image from"
        required: true
        type: string
    outputs:
      image:
        description: "The builder image, pinned by digest"
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read

jobs:
  image:
    name: Build or Reuse Builder Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coordinator-builder:$(python3 scripts/builder_image.py tag)" >> "$GITHUB_OUTPUT"
          echo "wasm_bindgen=$(python3 scripts/builder_image.py wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - name: Look for a published image
        id: existing
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          if DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' 2>/dev/null); then
            echo "digest=$(echo "$DIGEST" | tr -d '"')" >> "$GITHUB_OUTPUT"
            echo "Reusing $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Free disk space
        if: steps.existing.outputs.digest == ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.digest == ''
      - name: Build and push
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/builder/Dockerfile
          build-args: WASM_BINDGEN_VERSION=${{ steps.name.outputs.wasm_bindgen }}
          tags: ${{ steps.name.outputs.image }}
          push: true
          provenance: false
      - name: Pin the image by digest
        id: publish
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for $IMAGE" >&2; exit 1; }
          echo "image=${IMAGE%:*}@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Builder image: ${IMAGE%:*}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
